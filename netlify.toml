[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Configuração de redirecionamento para Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redirecionamento SPA para React Router / navegação do app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
